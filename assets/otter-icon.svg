<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Otter macOS app icon. The "Ink" otter mark recoloured for a filled ground:
    a river-teal squircle with a white otter head and a teal muzzle cut-out, so
    it reads at Dock size. Source of truth for the launcher icon (see
    scripts/make-app.sh). Brand accent = river teal (#0f766e).
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12897f" />
      <stop offset="1" stop-color="#0b5c56" />
    </linearGradient>
  </defs>

  <!-- squircle ground (transparent margin around it, per macOS icon grid) -->
  <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#ground)" />

  <!-- otter mark, drawn in the mark's native 0–64 space then scaled/centred -->
  <g transform="translate(64,152) scale(14)">
    <!-- ears -->
    <circle cx="19" cy="15" r="7.5" fill="#f6fbfa" />
    <circle cx="45" cy="15" r="7.5" fill="#f6fbfa" />
    <circle cx="19" cy="15" r="3" fill="#0b5f59" />
    <circle cx="45" cy="15" r="3" fill="#0b5f59" />
    <!-- head -->
    <ellipse cx="32" cy="33" rx="20" ry="19" fill="#f6fbfa" />
    <!-- muzzle / face (teal cut-out) -->
    <ellipse cx="32" cy="40" rx="14" ry="12.5" fill="#0b5f59" />
    <!-- whiskers -->
    <g stroke="#f6fbfa" stroke-width="1" stroke-linecap="round" opacity="0.7" fill="none">
      <path d="M26 40 L14.5 38.5" />
      <path d="M26 42 L14.5 43" />
      <path d="M38 40 L49.5 38.5" />
      <path d="M38 42 L49.5 43" />
    </g>
    <!-- eyes -->
    <circle cx="24.5" cy="31" r="2.9" fill="#f6fbfa" />
    <circle cx="39.5" cy="31" r="2.9" fill="#f6fbfa" />
    <circle cx="25.4" cy="30.1" r="0.9" fill="#0b5f59" />
    <circle cx="40.4" cy="30.1" r="0.9" fill="#0b5f59" />
    <!-- nose + mouth -->
    <ellipse cx="32" cy="38" rx="3" ry="2.3" fill="#f6fbfa" />
    <path d="M32 40.3 v1.8 M32 42.1 q -3 2.1 -5.4 -0.2 M32 42.1 q 3 2.1 5.4 -0.2"
          stroke="#f6fbfa" stroke-width="1.4" stroke-linecap="round" fill="none" />
  </g>
</svg>
