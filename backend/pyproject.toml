[project]
name = "otter-backend"
version = "0.1.0"
description = "Otter — personal work OS. FastAPI backend (write API, quick-capture, Google sync, Electric shape auth)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "mcp>=2.2.0",
    # Agentic quick-capture: OpenAI SDK routes the filing LLM call through the
    # AI Gateway so mlflow autologging can trace it. Both are optional at runtime
    # (guarded imports) — tracing stays off until MLFLOW_EXPERIMENT is set.
    "openai>=1.50",
    "mlflow-skinny>=2.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false
# databricks-sdk 0.140.0 (a transitive dep of mlflow-skinny) 403s on the
# dev pypi proxy — its wheel metadata isn't mirrored. Pin below it to a version
# the proxy serves; bump this once 0.140.0+ is available.
constraint-dependencies = ["databricks-sdk<0.140"]
